name: Python Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Lint with Ruff
        run: |
          uv run ruff check --output-format github scripts/ tests/

      - name: Check formatting with Black
        run: |
          uv run black --check scripts/ tests/

      - name: Check types with Mypy
        run: |
          uv run mypy scripts/ tests/

      - name: Check documentation naming
        run: |
          uv run scripts/python/validate_docs.py

      - name: Check integrity bypasses are disabled
        env:
          PSI_BYPASS_LOOKAHEAD: ${{ vars.PSI_BYPASS_LOOKAHEAD }}
          PSI_BYPASS_WINDOW_GUARD: ${{ vars.PSI_BYPASS_WINDOW_GUARD }}
        run: |
          # Two layers: the repo-level variables actually reaching a run, and any
          # committed file that would switch a bypass on. Without the env: mapping
          # above these shell vars are always empty, so the checks could never fire.
          for flag in PSI_BYPASS_LOOKAHEAD PSI_BYPASS_WINDOW_GUARD; do
            if [ "${!flag}" == "true" ]; then
              echo "::error::$flag is set to true as a repository variable. Production/CI builds must run with integrity guards enabled."
              exit 1
            fi
          done

          if grep -rniE 'PSI_BYPASS_(LOOKAHEAD|WINDOW_GUARD)[=:][[:space:]]*.?true' .github/ .env .env.example 2>/dev/null; then
            echo "::error::A committed file enables an integrity bypass. Remove it before merging."
            exit 1
          fi

      - name: Run tests
        run: |
          uv run pytest -q
