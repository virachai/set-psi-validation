name: Prediction Full Day
on:
  schedule:
    - cron: "0 2 * * 1-5" # 09:00 ICT
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv run scripts/python/predictions_loader.py --session full_day
        env:
          PSI_ENGINE_API_KEY: ${{ secrets.PSI_ENGINE_API_KEY }}
          PSI_API_URL: ${{ secrets.PSI_API_URL }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
      - name: Commit
        run: |
          git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          git config --local user.name 'github-actions[bot]'
          git add predictions/ || true
          git diff --staged --quiet || git commit -m "Full Day Prediction Capture: $(date +'%Y-%m-%d')"
          git push
