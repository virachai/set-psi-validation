name: Intraday Market Cycle

on:
  push:
    branches: [main]
    paths-ignore:
      - "market-data/**"
      - "predictions/**"
      - "reports/**"
      - "validation/**"
      - "catalog.json"
  schedule:
    # Retry within every prediction/capture window. GitHub scheduled jobs can be
    # delayed, so a single daily trigger is not reliable enough for market-time
    # artifacts. The step-decider remains the final time-window safety gate.
    - cron: "3,13,23,33,43,53 1 * * 1-5"   # ICT 08:03-08:53 — AM prediction
    - cron: "3,13,23,33,43,53 2 * * 1-5"   # ICT 09:03-09:53 — Full-day prediction
    - cron: "3,13,23,33,43,53 3-4 * * 1-5" # ICT 10:03-11:53 — ATO retry window
    - cron: "3,13,23,33,43,53 5 * * 1-5"   # ICT 12:03-12:53 — ATO / noon
    - cron: "3,13,23,33,43,53 6 * * 1-5"   # ICT 13:03-13:53 — PM prediction
    - cron: "33,43,53 7 * * 1-5"           # ICT 14:33-14:53 — PM open
    - cron: "3,13,23,33,43,53 8 * * 1-5"   # ICT 15:03-15:53 — PM open retry
    - cron: "3,13,23 9 * * 1-5"            # ICT 16:03-16:23 — PM open final retry
    - cron: "48 9 * * 1-5"                 # ICT 16:48 — ATC settlement
  workflow_dispatch:
    inputs:
      step:
        description: "Step to run (default 'auto' decides by current ICT time)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - prediction-am
          - prediction-full-day
          - ato
          - noon
          - prediction-pm
          - pmopen
          - atc
          - validation
          - all

permissions:
  contents: write

jobs:
  market-cycle:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Dependencies are handled per-script via PEP 723 inline metadata.
      # uv run auto-installs dependencies declared in each script.

      - name: Determine Step
        id: step-decider
        run: |
          echo "System Time (UTC): $(date -u)"
          echo "Market Time (ICT): $(TZ='Asia/Bangkok' date)"

          if [[ '${{ github.event_name }}' == 'workflow_dispatch' && '${{ github.event.inputs.step }}' != 'auto' ]]; then
            echo "Trigger: Manual (${{ github.event.inputs.step }})"
            echo 'step=${{ github.event.inputs.step }}' >> $GITHUB_OUTPUT
          else
            # Range-based windows for push, schedule, and manual 'auto': tolerate cron delay and prevent lookahead bias
            H_ICT=$(TZ='Asia/Bangkok' date +%H)
            M_ICT=$(TZ='Asia/Bangkok' date +%M)
            echo "Trigger: ${{ github.event_name }} (${{ github.event.inputs.step || 'scheduled' }}) -> ICT: ${H_ICT}:${M_ICT}"

            # Safety Gate: Stop if outside market hours (08:00 - 18:00)
            # Windows follow the SET session calendar: morning 10:00-12:30,
            # lunch break 12:30-14:30, afternoon 14:30-16:30, ATC ~16:30-16:40.
            # Each bucket must land inside capture_market.CAPTURE_WINDOWS for its mode,
            # otherwise the capture guard raises.
            if [[ "$H_ICT" -lt 8 || "$H_ICT" -ge 18 ]]; then
              echo 'step=none' >> $GITHUB_OUTPUT
              echo "Outside market hours, exiting."
            elif [[ "$H_ICT" -ge 17 ]]; then echo 'step=validation' >> $GITHUB_OUTPUT;
            elif [[ "$H_ICT" -eq 16 && "$M_ICT" -ge 40 ]]; then echo 'step=atc' >> $GITHUB_OUTPUT;
            elif [[ "$H_ICT" -eq 16 && "$M_ICT" -ge 20 ]]; then echo 'step=none' >> $GITHUB_OUTPUT; # Pre-close + closing auction (16:30-16:40): stop emitting pmopen 10min early so a cold `uv` start cannot cross the 16:30 cutoff mid-run
            elif [[ "$H_ICT" -eq 16 || "$H_ICT" -eq 15 || ( "$H_ICT" -eq 14 && "$M_ICT" -ge 30 ) ]]; then echo 'step=pmopen' >> $GITHUB_OUTPUT; # Afternoon continuous session opens 14:30; 14:00-14:30 is the pre-open auction
            elif [[ "$H_ICT" -ge 13 ]]; then echo 'step=prediction-pm' >> $GITHUB_OUTPUT;
            elif [[ "$H_ICT" -eq 12 && "$M_ICT" -ge 30 ]]; then echo 'step=noon' >> $GITHUB_OUTPUT;
            elif [[ "$H_ICT" -ge 10 ]]; then echo 'step=ato' >> $GITHUB_OUTPUT;
            elif [[ "$H_ICT" -ge 9 ]]; then echo 'step=prediction-full-day' >> $GITHUB_OUTPUT;
            elif [[ "$H_ICT" -ge 8 ]]; then echo 'step=prediction-am' >> $GITHUB_OUTPUT;
            else echo 'step=none' >> $GITHUB_OUTPUT; fi
          fi

      - name: Run Prediction Capture (AM)
        if: (steps.step-decider.outputs.step == 'prediction-am' || steps.step-decider.outputs.step == 'all') && steps.step-decider.outputs.step != 'none'
        run: |
          echo 'Running Prediction Capture for AM at 08:00 ICT...'
          uv run scripts/python/predictions_loader.py --session am
        env:
          PSI_ENGINE_API_KEY: ${{ secrets.PSI_ENGINE_API_KEY }}
          PSI_API_URL: ${{ secrets.PSI_API_URL }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}

      - name: Run Prediction Capture (Full Day)
        if: (steps.step-decider.outputs.step == 'prediction-full-day' || steps.step-decider.outputs.step == 'all') && steps.step-decider.outputs.step != 'none'
        run: |
          echo 'Running Prediction Capture for Full Day at 09:00 ICT...'
          uv run scripts/python/predictions_loader.py --session full_day
        env:
          PSI_ENGINE_API_KEY: ${{ secrets.PSI_ENGINE_API_KEY }}
          PSI_API_URL: ${{ secrets.PSI_API_URL }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}

      - name: Run ATO Capture
        if: (steps.step-decider.outputs.step == 'ato' || steps.step-decider.outputs.step == 'all') && steps.step-decider.outputs.step != 'none'
        continue-on-error: ${{ steps.step-decider.outputs.step == 'all' || github.event_name == 'workflow_dispatch' }}
        run: |
          echo 'Running ATO Capture at 10:00 ICT (morning session open)...'
          uv run scripts/python/capture_market.py --mode ato --symbol ^SET.BK --provider yahoo
        env:
          SETSMART_API_KEY: ${{ secrets.SETSMART_API_KEY }}

      - name: Run Noon Capture
        if: (steps.step-decider.outputs.step == 'noon' || steps.step-decider.outputs.step == 'all') && steps.step-decider.outputs.step != 'none'
        continue-on-error: ${{ steps.step-decider.outputs.step == 'all' || github.event_name == 'workflow_dispatch' }}
        run: |
          echo 'Running Noon Capture at 12:30 ICT (morning session close / lunch break)...'
          uv run scripts/python/capture_market.py --mode noon --symbol ^SET.BK --provider yahoo
        env:
          SETSMART_API_KEY: ${{ secrets.SETSMART_API_KEY }}

      - name: Run Prediction Capture (PM)
        if: (steps.step-decider.outputs.step == 'prediction-pm' || steps.step-decider.outputs.step == 'all') && steps.step-decider.outputs.step != 'none'
        run: |
          echo 'Running Prediction Capture for PM at 13:00 ICT...'
          uv run scripts/python/predictions_loader.py --session pm
        env:
          PSI_ENGINE_API_KEY: ${{ secrets.PSI_ENGINE_API_KEY }}
          PSI_API_URL: ${{ secrets.PSI_API_URL }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}

      - name: Run PM Open Capture
        if: (steps.step-decider.outputs.step == 'pmopen' || steps.step-decider.outputs.step == 'all') && steps.step-decider.outputs.step != 'none'
        continue-on-error: ${{ steps.step-decider.outputs.step == 'all' || github.event_name == 'workflow_dispatch' }}
        run: |
          echo 'Running PM Open Capture at 14:30 ICT (afternoon session open)...'
          uv run scripts/python/capture_market.py --mode pmopen --symbol ^SET.BK --provider yahoo
        env:
          SETSMART_API_KEY: ${{ secrets.SETSMART_API_KEY }}

      - name: Run ATC Capture
        if: (steps.step-decider.outputs.step == 'atc' || steps.step-decider.outputs.step == 'all') && steps.step-decider.outputs.step != 'none'
        continue-on-error: ${{ steps.step-decider.outputs.step == 'all' || github.event_name == 'workflow_dispatch' }}
        run: |
          echo 'Running ATC Capture at 16:40 ICT (after the 16:30-16:40 closing auction settles)...'
          uv run scripts/python/capture_market.py --mode atc --symbol ^SET.BK --provider yahoo
        env:
          SETSMART_API_KEY: ${{ secrets.SETSMART_API_KEY }}

      - name: Run Validation & Metrics
        if: (steps.step-decider.outputs.step == 'validation' || steps.step-decider.outputs.step == 'all') && steps.step-decider.outputs.step != 'none'
        run: |
          echo 'Running Validation & Metrics at 17:00 ICT...'
          uv run scripts/python/validation_engine.py

      - name: Enrich JSON files with schema.org JSON-LD
        if: success() && steps.step-decider.outputs.step != 'none'
        run: |
          echo 'Adding schema.org @context/@type to data artifacts...'
          uv run scripts/python/jsonld_enricher.py

      - name: Pre-commit Data Validation
        if: success() && steps.step-decider.outputs.step != 'none'
        run: |
          echo 'Verifying data integrity and logic before commit...'
          uv run pytest tests/python/test_capture_market.py tests/python/test_validation_engine.py tests/python/test_setsmart_integration.py -q

      - name: Commit and Push changes
        if: success() && steps.step-decider.outputs.step != 'none'
        run: |
          git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          git config --local user.name 'github-actions[bot]'
          # Only add files if they exist to avoid git add error
          find market-data predictions reports validation -maxdepth 1 -name '*.json' -exec git add {} + 2>/dev/null || true
          git add catalog.json docs/010-regime-taxonomy-v01.json || true
          # Only commit if something was actually staged
          git diff --staged --quiet || git commit -m "Automated market data update: $(date +'%Y-%m-%d') (${{ github.event_name }})"
          git push
