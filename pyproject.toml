[project]
name = "set-psi-validation"
version = "0.1.0"
description = "Market regime validation pipeline for PSI"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv",
    "httpx",
    "pandas",
    "numpy",
    "pdfplumber",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "ruff",
    "black",
    "mypy",
    "pytest",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# Tests: pytest assert-based idiom; tests intentionally untyped (mypy disallows nothing);
# parameterized tests legitimately take param values + fixtures as arguments.
# CPY001: Ignore missing copyright notice in tests and scripts
# PLR0917: Ignore too many positional arguments in parameterized test methods
"tests/**" = ["S101", "ANN", "D", "ARG", "PLR2004", "PLR0913", "CPY001", "PLR0917"]
# CLI scripts: stdout print is the operator interface; entry points and provider
# boundaries deliberately catch broadly to log-and-exit / fall back to None.
# INP001: scripts/ is a runnable-scripts directory, not an importable package
# (adding __init__.py would collide with tests/python under mypy module mapping).
# CPY001: Ignore missing copyright notice in scripts
"scripts/**" = ["T201", "BLE001", "INP001", "CPY001"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
